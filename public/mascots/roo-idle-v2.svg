      <path d="M -1.5 1 L -1.5 3 M 1.5 1 L 1.5 3" fill="none" stroke-width="1.2" />
    </g>
  </defs>
  <g stroke="#63391F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
