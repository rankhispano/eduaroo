        <path d="M 101 30 C 111 27 124 25 135 27 L 136 32 C 124 30 112 33 102 35 Z" fill="#93633A" stroke-width="1.2" />
        <path d="M 87 38 C 95 31 110 28 124 27 C 139 25 151 26 156 29 C 158 31 148 34 135 35 C 117 36 101 37 89 40 C 87 41 85 40 87 38 Z" fill="#C8B785" />
        <circle cx="118" cy="23" r="3.6" fill="#FFFDF7" stroke-width="1.2" />
        <path d="M 117 25 L 119 21" fill="none" stroke-width="1.2" />
      </g>
    </g>
  </g>
