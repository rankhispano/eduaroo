      <path d="M 117 85 C 114 97 117 111 126 125 C 137 141 141 154 137 170 C 133 185 122 198 107 202 C 109 187 105 175 102 164 C 99 149 104 133 111 117 C 117 103 112 95 111 89 Z" fill="url(#roo-idle-r2-cream)" stroke="none" />
    </g>
    <g id="roo-idle-r2-roo-leg-near">
