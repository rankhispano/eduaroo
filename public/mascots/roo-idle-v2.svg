    </linearGradient>
    <linearGradient id="roo-idle-r2-blue" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#77BCE9" />
      <stop offset="50%" stop-color="#559CD3" />
      <stop offset="100%" stop-color="#387CB7" />
    </linearGradient>
